<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Danh sách món ăn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success px-3">
        <a class="navbar-brand" href="#">Quản lý</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="res.html">Trang chủ</a></li>
                <li class="nav-item"><a class="nav-link" href="index.html">Quản lý nhân viên</a></li>
                <li class="nav-item"><a class="nav-link" href="thongke.html">Thống kê</a></li>
                <li class="nav-item"><a class="nav-link" href="kho.html">Quản lý kho</a></li>
                <li class="nav-item"><a class="nav-link" href="themmon.html">Thêm món</a></li>
            </ul>
            <button class="btn btn-danger" id="logoutBtn">Đăng xuất</button>
        </div>
    </nav>
    <div class="container my-4">
        <h2 class="mb-4">Danh sách món ăn có thể nấu</h2>

        <button id="reset-discount-btn" class="btn btn-danger mb-3">Reset tất cả Discount về 1</button>

        <div class="table-responsive">
            <table class="table table-bordered text-center align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Tên món</th>
                        <th>Giá gốc</th>
                        <th>Giá hiện tại</th>
                        <th>Discount hiện tại</th>
                        <th>Discount đề xuất</th>
                        <th>Giá nếu áp dụng đề xuất</th>
                        <th>Số lượng còn</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody id="menu-body"></tbody>
            </table>
        </div>

        <h2 class="mb-4">Kho nguyên liệu</h2>
        <div class="table-responsive">
            <table class="table table-bordered table-striped align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Nguyên liệu</th>
                        <th>Số lượng</th>
                    </tr>
                </thead>
                <tbody id="khoTable"></tbody>
            </table>
        </div>
    </div>
    <script>
        function loadMenu() {
            fetch("http://160.191.175.184:3000/restaurant/mon-an-co-the-nau")
                .then(response => response.json())
                .then(data => {
                    const tbody = document.getElementById("menu-body");
                    tbody.innerHTML = "";
                    data.forEach(mon => {
                        const giaGoc = mon.gia;
                        const currentDiscount = mon.discount;
                        const giaHienTai = Math.round(giaGoc * currentDiscount);
                        const discountDeXuat = Math.max(0.5, 1 - (mon.so_luong_co_the_nau / 100));
                        const giaNeuGiam = Math.round(giaGoc * discountDeXuat);

                        const tr = document.createElement("tr");
                        tr.innerHTML = `
              <td>${mon.ten_mon}</td>
              <td>${giaGoc.toLocaleString()} đ</td>
              <td>${giaHienTai.toLocaleString()} đ</td>
              <td>${(100 - currentDiscount * 100).toFixed(0)}%</td>
              <td class="${currentDiscount === 1 ? 'highlight' : ''}">${(100 - discountDeXuat * 100).toFixed(0)}%</td>
              <td>${giaNeuGiam.toLocaleString()} đ</td>
              <td>${mon.so_luong_co_the_nau}</td>
              <td>
                <div style="display: flex; gap: 8px;">
                    <button class="btn btn-success" onclick="applyDiscount('${mon.ten_mon}', ${discountDeXuat})">Giảm giá</button>
                    <button class="btn btn-success" onclick="applyDiscount('${mon.ten_mon}', 1)">Restart</button>
                </div>
              </td>
            `;
                        tbody.appendChild(tr);
                    });
                })
                .catch(error => {
                    console.error("Lỗi khi fetch dữ liệu:", error);
                });
        }
        const token = localStorage.getItem('token');

        fetch('/restaurant/kho', {
            headers: {
                'Authorization': `Bearer ${token}`
            }
        })
            .then(res => {
                if (!res.ok) throw new Error('Không lấy được dữ liệu kho');
                return res.json();
            })
            .then(kho => {
                const tbody = document.getElementById('khoTable');
                tbody.innerHTML = kho.map(row =>
                    `<tr><td>${row.ten_nguyen_lieu}</td><td>${row.so_luong}g</td></tr>`
                ).join('');
            })
            .catch(err => {
                console.error('Lỗi:', err);
            });

        async function applyDiscount(ten_mon, discount) {
            if (!confirm(`Áp dụng discount ${Math.round(discount * 100)}% cho "${ten_mon}"?`)) return;

            try {
                const response = await fetch("http://160.191.175.184:3000/restaurant/mon-an/update-discount", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ ten_mon, discount })
                });

                const result = await response.json();
                if (response.ok) {
                    alert(result.message || "Đã cập nhật discount.");
                    loadMenu();
                } else {
                    alert(result.error || "Đã xảy ra lỗi.");
                }
            } catch (error) {
                alert("Không thể kết nối đến server.");
                console.error(error);
            }
        }

        document.getElementById("reset-discount-btn").addEventListener("click", async () => {
            if (!confirm("Bạn có chắc muốn reset tất cả discount về 1?")) return;

            try {
                const response = await fetch("http://160.191.175.184:3000/restaurant/mon-an/reset-discount", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    }
                });

                const result = await response.json();
                if (response.ok) {
                    alert(result.message || "Đã reset discount.");
                    loadMenu();
                } else {
                    alert(result.error || "Đã xảy ra lỗi.");
                }
            } catch (error) {
                alert("Không thể kết nối đến server.");
                console.error(error);
            }
        });

        loadMenu();
    </script>
</body>

</html>
