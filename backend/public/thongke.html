<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <title>Thống kê nhà hàng</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-success px-3">
        <a class="navbar-brand" href="#">Quản lý</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="res.html">Trang chủ</a></li>
                <li class="nav-item"><a class="nav-link" href="index.html">Quản lý nhân viên</a></li>
                <li class="nav-item"><a class="nav-link" href="thongke.html">Thống kê</a></li>
                <li class="nav-item"><a class="nav-link" href="kho.html">Quản lý kho</a></li>
                <li class="nav-item"><a class="nav-link" href="themmon.html">Thêm món</a></li>
            </ul>
            <button class="btn btn-danger" id="logoutBtn">Đăng xuất</button>
        </div>
    </nav>
    <div class="container my-4">
        <h1 class="mb-4">Thống kê Nhà hàng</h1>

        <div id="loading" class="mb-3">Đang tải dữ liệu...</div>
        <div id="error" class="alert alert-danger d-none"></div>

        <!-- Chọn ngày -->
        <form class="row g-3 align-items-center mb-4" id="dateForm" onsubmit="return false;">
            <div class="col-auto">
                <label for="startDate" class="col-form-label">Từ ngày:</label>
            </div>
            <div class="col-auto">
                <input type="date" id="startDate" class="form-control" value="2025-05-20" max="2025-12-31" />
            </div>
            <div class="col-auto">
                <label for="endDate" class="col-form-label">Đến ngày:</label>
            </div>
            <div class="col-auto">
                <input type="date" id="endDate" class="form-control" value="2025-05-28" max="2025-12-31" />
            </div>
            <div class="col-auto">
                <button id="updateBtn" class="btn btn-primary">Cập nhật</button>
            </div>
        </form>

        <h2 class="mb-3">Doanh thu hôm nay</h2>
        <canvas id="todayRevenueChart" class="w-100" style="max-height: 200px;"></canvas>

        <h2 class="mt-5 mb-3">Món ăn bán chạy</h2>
        <canvas id="bestSellersChart" class="w-100" style="max-height: 100px;"></canvas>

        <h2 class="mt-5 mb-3">Doanh thu theo ngày</h2>
        <canvas id="revenueByDayChart" class="w-100" style="max-height: 200px;"></canvas>
    </div>

    <script>
        // Global chart instances để tránh trùng lặp khi render lại
        let todayChart = null;
        let bestSellersChart = null;
        let revenueChart = null;

        // Lấy token kèm Bearer
        function getAuthToken() {
            const rawToken = localStorage.getItem("token") || "";
            return rawToken.startsWith("Bearer ") ? rawToken : `Bearer ${rawToken}`;
        }

        // Wrapper fetch với timeout và xử lý lỗi cơ bản
        async function fetchWithTimeout(url, options = {}, timeout = 8000) {
            const controller = new AbortController();
            const id = setTimeout(() => controller.abort(), timeout);

            try {
                const response = await fetch(url, { ...options, signal: controller.signal });
                clearTimeout(id);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                return await response.json();
            } catch (error) {
                clearTimeout(id);
                throw error;
            }
        }

        // Hiển thị loading hoặc lỗi
        function showLoading(isLoading) {
            document.getElementById("loading").style.display = isLoading ? "block" : "none";
        }

        function showError(message = "") {
            const errDiv = document.getElementById("error");
            if (message) {
                errDiv.textContent = message;
                errDiv.style.display = "block";
            } else {
                errDiv.style.display = "none";
            }
        }

        // Render Chart có destroy chart cũ nếu có
        function renderChart(canvasId, config, chartInstanceRef) {
            if (chartInstanceRef && chartInstanceRef.destroy) {
                chartInstanceRef.destroy();
            }
            return new Chart(document.getElementById(canvasId), config);
        }
        function renderTodayChart(data) {
            // Chart số hóa đơn và số khách (giá trị nhỏ)
            if (todayChart) todayChart.destroy();
            todayChart = new Chart(document.getElementById("todayRevenueChart"), {
                type: 'bar',
                data: {
                    labels: ["Số hóa đơn", "Số khách"],
                    datasets: [{
                        label: "Thống kê hôm nay",
                        data: [data.so_hoa_don, data.so_khach],
                        backgroundColor: ["#3e95cd", "#3cba9f"]
                    }]
                },
                options: {
                    responsive: true,
                    scales: { y: { beginAtZero: true, stepSize: 1 } }
                }
            });

            // Tạo thêm canvas mới hoặc tái sử dụng canvas doanh thu (tách canvas nhé)
            let revenueCanvas = document.getElementById("todayRevenueChartRevenue");
            if (!revenueCanvas) {
                revenueCanvas = document.createElement("canvas");
                revenueCanvas.id = "todayRevenueChartRevenue";
                revenueCanvas.width = 800;
                revenueCanvas.height = 100;
                document.getElementById("todayRevenueChart").parentNode.insertBefore(revenueCanvas, document.getElementById("todayRevenueChart").nextSibling);
            }
            // Destroy chart nếu tồn tại
            // if (window.todayRevenueChartRevenue) window.todayRevenueChartRevenue.destroy();

            // Chart riêng cho doanh thu
            window.todayRevenueChartRevenue = new Chart(revenueCanvas, {
                type: 'bar',
                data: {
                    labels: ["Tổng doanh thu"],
                    datasets: [{
                        label: "Doanh thu hôm nay",
                        data: [data.tong_doanh_thu],
                        backgroundColor: "#8e5ea2"
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                // Format tiền VNĐ
                                callback: function (value) {
                                    return value.toLocaleString('vi-VN') + "₫";
                                }
                            }
                        }
                    }
                }
            });
        }

        function renderBestSellersChart(data) {
            // Nếu pieChart tồn tại thì destroy để tránh lỗi vẽ đè
            if (window.pieChart) window.pieChart.destroy();

            const ctx = document.getElementById("bestSellersChart").getContext("2d");

            window.pieChart = new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: data.map(d => d.ten_mon),
                    datasets: [{
                        label: 'Tỷ lệ món ăn bán chạy',
                        data: data.map(d => d.tong_so_luong),
                        backgroundColor: generateColors(data.length),
                        borderColor: '#fff',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'right',
                            labels: {
                                boxWidth: 20,
                                padding: 15
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function (context) {
                                    const label = context.label || '';
                                    const value = context.parsed || 0;
                                    return `${label}: ${value} món`;
                                }
                            }
                        }
                    }
                }
            });
        }

        // Hàm tạo mảng màu đẹp tự động
        function generateColors(num) {
            const colors = [];
            const baseColors = [
                '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0',
                '#9966FF', '#FF9F40', '#E7E9ED', '#71B37C',
                '#FF6384', '#36A2EB'
            ];
            for (let i = 0; i < num; i++) {
                colors.push(baseColors[i % baseColors.length]);
            }
            return colors;
        }

        function renderRevenueByDayChart(data) {
            if (!Array.isArray(data) || data.length === 0) {
                showError("Không có dữ liệu doanh thu theo ngày.");
                return;
            }
            showError(""); // reset error

            const config = {
                type: 'line',
                data: {
                    labels: data.map(d => d.ngay),
                    datasets: [{
                        label: 'Doanh thu theo ngày',
                        data: data.map(d => d.tong_doanh_thu),
                        fill: false,
                        borderColor: '#27ae60',
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    scales: { y: { beginAtZero: true } }
                }
            };
            revenueChart = renderChart("revenueByDayChart", config, revenueChart);
        }

        async function fetchAndRender() {
            showLoading(true);
            showError("");
            const token = getAuthToken();
            if (!token || token === "Bearer ") {
                showLoading(false);
                showError("Token không hợp lệ hoặc chưa đăng nhập.");
                return;
            }

            const headers = {
                "Content-Type": "application/json",
                "Authorization": token
            };

            try {
                let tuNgay = document.getElementById("startDate").value;
                let denNgay = document.getElementById("endDate").value;



                const [todayRes, bestSellerRes, revenueRes] = await Promise.all([
                    fetchWithTimeout(`http://160.191.175.184:3000/restaurant/thong-ke/hom-nay`, { headers }),
                    fetchWithTimeout(`http://160.191.175.184:3000/restaurant/thong-ke/mon-ban-chay?tu_ngay=${tuNgay}&den_ngay=${denNgay}&limit=10`, { headers }),
                    fetchWithTimeout(`http://160.191.175.184:3000/restaurant/thong-ke/doanh-thu?tu_ngay=${tuNgay}&den_ngay=${denNgay}`, { headers })
                ]);

                renderTodayChart(todayRes.tong_quan);
                renderBestSellersChart(bestSellerRes);
                renderRevenueByDayChart(revenueRes);
            } catch (error) {
                showError("Lỗi tải dữ liệu: " + error.message);
            } finally {
                showLoading(false);
            }
        }

        fetchAndRender();
        document.getElementById("updateBtn").addEventListener("click", () => {
            fetchAndRender();
        });
    </script>
</body>

</html>
